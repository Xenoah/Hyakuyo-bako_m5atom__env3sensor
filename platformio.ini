; M5Atom Matrix + Unit ENV III (SHT30 + QMP6988)
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.12.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 1500000
lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
    m5stack/M5Unit-ENV@1.7.3
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1

; USB で書き込み
[env:m5atom-matrix]

; Wi-Fi 経由 (ArduinoOTA) で書き込み: pio run -e m5atom-matrix-ota -t upload
; 一度 USB で書き込んだ後に使えます。パスワードを設定した場合は --auth も合わせてください。
[env:m5atom-matrix-ota]
upload_protocol = espota
upload_port = env3.local
; upload_flags = --auth=your-ota-password
